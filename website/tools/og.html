<!doctype html>
<!-- 1200 × 630 share image. Render with: node website/tools/render_og.mjs -->
<html lang="zh-Hans">
<meta charset="utf-8">
<style>
@font-face { font-family: "Nunito"; font-weight: 200 1000; src: url("../public/fonts/nunito-latin.woff2") format("woff2"); }
html, body { margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; position: relative; background: radial-gradient(circle at 78% 45%, rgba(255, 121, 115, 0.38), rgba(255, 81, 117, 0.08) 38%, transparent 62%), radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1.2px) 0 0 / 22px 22px, #2a2b31; font-family: "Nunito", -apple-system, "PingFang SC", sans-serif; color: #f4f1ee; }
.riko { position: absolute; right: 30px; top: 40px; width: 520px; -webkit-mask-image: linear-gradient(#000 80%, transparent); }
.copy { position: absolute; left: 72px; top: 150px; }
.icon { width: 88px; height: 88px; }
h1 { margin: 26px 0 0; font-size: 104px; font-weight: 900; line-height: 0.9; letter-spacing: -0.035em; }
h1 span { color: #ff7973; }
p { margin: 22px 0 0; font-size: 40px; font-weight: 800; line-height: 1.2; }
p em { font-style: normal; background: linear-gradient(135deg, #ff8f6c, #ff5175); -webkit-background-clip: text; color: transparent; }
</style>
<body>
<img class="riko" src="../assets/character/hero-character.png" alt="">
<div class="copy">
  <img class="icon" src="../public/img/app-icon-512.png" alt="">
  <h1>RightKit<span>.</span></h1>
  <p>Right-click. <em>Done.</em></p>
</div>
</body>
</html>
