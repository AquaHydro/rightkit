name: RightKit
options:
  bundleIdPrefix: app.rightkit
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  groupSortPosition: top
# 两个发布渠道（technical.md 发布渠道与标识）：官网版用 Debug、Release，商店版用 Debug-AppStore、Release-AppStore。
configs:
  Debug: debug
  Release: release
  Debug-AppStore: debug
  Release-AppStore: release
settings:
  base:
    RK_APP_ID: app.rightkit.mac
    RK_URL_SCHEME: rightkit
    RK_APP_GROUP: $(DEVELOPMENT_TEAM).$(RK_APP_ID)
    DEVELOPMENT_TEAM: Q9C87Z9H4G
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: 0.1.1
    CURRENT_PROJECT_VERSION: 5
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    REGISTER_APP_GROUPS: YES
  configs:
    AppStore:
      RK_APP_ID: app.rightkit.mac.store
      RK_URL_SCHEME: rightkit-store
packages:
  RightKitCore:
    path: Packages/RightKitCore
targets:
  RightKit:
    type: application
    platform: macOS
    sources:
      - path: RightKit
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
    dependencies:
      - package: RightKitCore
      - target: RightKitFinder
      - target: RightKitAgent
        embed: true
        codeSign: false
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_NAME: RightKit
        PRODUCT_BUNDLE_IDENTIFIER: $(RK_APP_ID)
        INFOPLIST_FILE: RightKit/Info.plist
        CODE_SIGN_ENTITLEMENTS: RightKit/RightKit.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readwrite
      configs:
        AppStore:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) APP_STORE
          # 商店版没有检查更新，不要网络权限（F-082）。
          CODE_SIGN_ENTITLEMENTS: RightKit/RightKit-AppStore.entitlements
    # agent 的 launchd 配置按渠道生成，文件名和服务名都随 RK_APP_ID、RK_APP_GROUP 变化。
    postBuildScripts:
      - name: Generate LaunchAgent plist
        script: |
          set -euo pipefail
          dir="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchAgents"
          mkdir -p "$dir"
          sed -e "s/__APP_ID__/${RK_APP_ID}/g" -e "s/__APP_GROUP__/${RK_APP_GROUP}/g" \
            "${SRCROOT}/RightKitAgent/LaunchAgent.plist" > "$dir/${RK_APP_ID}.agent.plist"
          plutil -lint "$dir/${RK_APP_ID}.agent.plist" >/dev/null
        inputFiles:
          - $(SRCROOT)/RightKitAgent/LaunchAgent.plist
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchAgents/$(RK_APP_ID).agent.plist
  RightKitFinder:
    type: app-extension
    platform: macOS
    sources:
      - path: RightKitFinder
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
    dependencies:
      - package: RightKitCore
    settings:
      base:
        PRODUCT_NAME: RightKitFinder
        PRODUCT_BUNDLE_IDENTIFIER: $(RK_APP_ID).finder
        INFOPLIST_FILE: RightKitFinder/Info.plist
        CODE_SIGN_ENTITLEMENTS: RightKitFinder/RightKitFinder.entitlements
        ENABLE_APP_SANDBOX: YES
  RightKitAgent:
    type: tool
    platform: macOS
    sources:
      - path: RightKitAgent
        excludes: ["Info.plist", "*.entitlements", "*.plist"]
    dependencies:
      - package: RightKitCore
    settings:
      base:
        PRODUCT_NAME: RightKitAgent
        PRODUCT_BUNDLE_IDENTIFIER: $(RK_APP_ID).agent
        INFOPLIST_FILE: RightKitAgent/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        CODE_SIGN_ENTITLEMENTS: RightKitAgent/RightKitAgent.entitlements
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
  RightKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RightKitTests
      - path: RightKit/Engine
      - path: RightKitFinder/MenuRenderer.swift
      - path: RightKitFinder/PendingPasteState.swift
    dependencies:
      - package: RightKitCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rightkit.mac.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RightKit:
    build:
      targets:
        RightKit: all
    test:
      targets:
        - package: RightKitCore/RightKitCoreTests
        - RightKitTests
    run:
      config: Debug
  RightKit App Store:
    build:
      targets:
        RightKit: all
    run:
      config: Debug-AppStore
    profile:
      config: Release-AppStore
    analyze:
      config: Debug-AppStore
    archive:
      config: Release-AppStore
