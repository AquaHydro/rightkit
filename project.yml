name: RightKit
options:
  bundleIdPrefix: app.rightkit
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    DEVELOPMENT_TEAM: Q9C87Z9H4G
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    REGISTER_APP_GROUPS: YES
packages:
  RightKitCore:
    path: Packages/RightKitCore
targets:
  RightKit:
    type: application
    platform: macOS
    sources:
      - path: RightKit
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
      - path: RightKitAgent/app.rightkit.mac.agent.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: RightKitCore
      - target: RightKitFinder
      - target: RightKitAgent
        embed: true
        codeSign: false
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_NAME: RightKit
        PRODUCT_BUNDLE_IDENTIFIER: app.rightkit.mac
        INFOPLIST_FILE: RightKit/Info.plist
        CODE_SIGN_ENTITLEMENTS: RightKit/RightKit.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
  RightKitFinder:
    type: app-extension
    platform: macOS
    sources:
      - path: RightKitFinder
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
    dependencies:
      - package: RightKitCore
    settings:
      base:
        PRODUCT_NAME: RightKitFinder
        PRODUCT_BUNDLE_IDENTIFIER: app.rightkit.mac.finder
        INFOPLIST_FILE: RightKitFinder/Info.plist
        CODE_SIGN_ENTITLEMENTS: RightKitFinder/RightKitFinder.entitlements
        ENABLE_APP_SANDBOX: YES
  RightKitAgent:
    type: tool
    platform: macOS
    sources:
      - path: RightKitAgent
        excludes: ["Info.plist", "*.entitlements", "*.plist"]
    dependencies:
      - package: RightKitCore
    settings:
      base:
        PRODUCT_NAME: RightKitAgent
        PRODUCT_BUNDLE_IDENTIFIER: app.rightkit.mac.agent
        INFOPLIST_FILE: RightKitAgent/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        CODE_SIGN_ENTITLEMENTS: RightKitAgent/RightKitAgent.entitlements
        SKIP_INSTALL: YES
  RightKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RightKitTests
      - path: RightKit/Engine
    dependencies:
      - package: RightKitCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rightkit.mac.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RightKit:
    build:
      targets:
        RightKit: all
    test:
      targets:
        - package: RightKitCore/RightKitCoreTests
        - RightKitTests
    run:
      config: Debug
